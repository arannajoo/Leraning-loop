<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>러닝루프</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="러닝루프">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* ═════════ 레트로 오락실 흑백: 검정 · 흰색 · 반투명 흰색 3색만 ═════════ */
:root{
  --bg:#000000; --ink:#FFFFFF; --dim:rgba(255,255,255,.45);
  --surface:#000000; --surface-2:#000000; --bubble:#000000;
  --line:var(--dim); --line-strong:var(--ink);
  --text:var(--ink); --muted:var(--dim); --faint:var(--dim);
  --kakao:var(--ink); --kakao-ink:var(--bg);
  --lamp:var(--ink); --lamp-ink:var(--bg); --danger:var(--dim);
  --pixel:"Press Start 2P",monospace;
  --font:"Galmuri14","Galmuri11",system-ui,-apple-system,"Apple SD Gothic Neo",Roboto,"Noto Sans KR",sans-serif;
  --dither:repeating-conic-gradient(var(--ink) 0 25%, var(--bg) 0 50%) 0 0/4px 4px;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000000; } }
:root[data-theme="dark"]{ --bg:#000000; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:#000; }
*,*::before,*::after{ box-sizing:inherit; border-radius:0!important; }
body{ margin:0; background:#000; color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:none; -moz-osx-font-smoothing:unset; font-smooth:never; text-rendering:optimizeSpeed;
  -webkit-tap-highlight-color:transparent; word-break:keep-all; overflow-wrap:anywhere; font-variant-numeric:tabular-nums; }
button,input,textarea{ font:inherit; color:inherit; word-break:keep-all; overflow-wrap:anywhere; }
button{ cursor:pointer; }
b,strong,h1,h2,h3{ font-weight:400; }
:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
.px{ font-family:var(--pixel); letter-spacing:0; }
@keyframes blink{ 50%{ opacity:0; } }
.blink{ animation:blink 1s steps(1,end) infinite; }
@media (prefers-reduced-motion:reduce){ *{ animation:none!important; } }

.wrap{ max-width:640px; margin:0 auto; padding:16px 16px 110px; }
.wrap.flow{ padding:0 0 150px; }

/* 상단 */
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; min-height:28px; }
.sync{ font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
.sync i{ width:6px; height:6px; background:var(--dim); display:inline-block; }
.sync.on i{ background:var(--ink); }
.h-page{ font-size:24px; line-height:1.25; margin:0 0 6px; }
.sub{ color:var(--dim); font-size:13px; margin:0 0 20px; }
.section{ margin-top:32px; }
.section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--ink); }
.section-head h2{ font-size:17px; margin:0; }
.section-head .more{ font-size:12px; color:var(--dim); background:none; border:0; padding:4px 0; }

/* 버튼: 누르면 반전 */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:0 16px; border:2px solid var(--ink); background:#000; color:var(--ink); font-size:15px; }
.btn:active:not(:disabled), .btn:hover:not(:disabled){ background:var(--ink); color:#000; }
.btn.primary{ border-width:3px; }
.btn.ghost{ border-color:transparent; color:var(--dim); }
.btn.ghost:hover:not(:disabled), .btn.ghost:active:not(:disabled){ background:transparent; color:var(--ink); }
.btn.block{ width:100%; }
.btn.lg{ min-height:64px; font-size:19px; }
.btn.sm{ min-height:36px; padding:0 12px; font-size:13px; border-width:2px; }
.btn:disabled{ border-color:var(--dim); color:var(--dim); cursor:not-allowed; }
.cta{ flex-direction:column; gap:6px; min-height:92px!important; border-width:4px!important; box-shadow:0 0 0 3px #000, 0 0 0 5px var(--ink); margin:6px 0; }
.cta .px{ font-size:10px; }

.card{ background:#000; border:2px solid var(--ink); padding:16px; }
.card h2{ font-size:16px; margin:0 0 4px; }
.empty{ color:var(--dim); font-size:13px; padding:16px; border:2px dashed var(--dim); text-align:center; }
textarea,input[type=text],input[type=search]{ width:100%; background:#000; border:2px solid var(--ink); padding:11px 13px; line-height:1.6; font-size:15px; resize:vertical; }
textarea:focus,input:focus{ outline:none; box-shadow:0 0 0 2px #000, 0 0 0 4px var(--ink); }
textarea::placeholder,input::placeholder{ color:var(--dim); }
textarea.tall{ min-height:160px; } textarea.mid{ min-height:96px; }

.resume{ margin-bottom:12px; border:3px solid var(--ink); }
.resume .label{ font-size:12px; color:var(--dim); margin-bottom:6px; }
.resume .q{ font-size:16px; line-height:1.5; margin-bottom:12px; }
.row{ display:flex; gap:8px; } .row > .btn{ flex:1; }

/* 지표: 숫자 크게, 라벨 작게 */
.metrics{ display:grid; grid-template-columns:repeat(3,1fr); gap:0; border:2px solid var(--ink); }
.metric{ padding:12px 8px 10px; border-right:2px solid var(--ink); border-bottom:2px solid var(--ink); text-align:center; }
.metric:nth-child(3n){ border-right:0; } .metric:nth-child(n+4){ border-bottom:0; }
.metric b{ display:block; font-family:var(--pixel); font-size:clamp(16px,5.5vw,24px); line-height:1.3; }
.metric small{ display:block; font-size:11px; color:var(--dim); line-height:1.35; margin-top:6px; }
.metric-foot{ font-size:12px; color:var(--dim); margin-top:10px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.insight{ margin-top:12px; font-size:13px; padding:12px 14px; border:2px dashed var(--ink); }

/* 목록 카드: 누르면 반전 */
.list{ display:flex; flex-direction:column; gap:10px; }
.item{ position:relative; background:#000; border:2px solid var(--ink); padding:13px 14px 13px 20px; text-align:left; width:100%; display:block; }
.item::before{ content:""; position:absolute; left:6px; top:10px; bottom:10px; width:5px; background:var(--dim); }
.item.rv::before{ background:var(--ink); }
.item.ib::before{ background:var(--dither); }
button.item{ padding-right:40px; }
button.item::after{ content:""; position:absolute; right:14px; top:50%; margin-top:-6px; border-left:8px solid var(--ink); border-top:6px solid transparent; border-bottom:6px solid transparent; }
button.item:hover, button.item:active{ background:var(--ink); color:#000; }
button.item:hover::before, button.item:active::before{ background:#000; }
button.item:hover::after, button.item:active::after{ border-left-color:#000; }
button.item:hover .meta, button.item:active .meta{ color:#000; }
button.item:hover .pill, button.item:active .pill{ border-color:#000; color:#000; background:transparent; }
.item .q{ font-size:15px; line-height:1.5; }
.item .meta{ font-size:12px; color:var(--dim); margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:5px 10px; }
.item .actions{ display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
.pill{ display:inline-flex; align-items:center; font-size:11px; padding:0 6px; border:1px solid var(--dim); color:var(--dim); }
.pill.lamp{ background:var(--ink); color:#000; border-color:var(--ink); }
.pill.mist{ border-style:dashed; color:var(--ink); border-color:var(--ink); }

/* 하단 탭 */
.tabs{ position:fixed; left:0; right:0; bottom:0; background:#000; border-top:2px solid var(--ink); padding-bottom:env(safe-area-inset-bottom,0px); z-index:10; }
.tabs-in{ max-width:640px; margin:0 auto; display:grid; grid-template-columns:repeat(5,1fr); }
.tab{ background:none; border:0; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:11px; color:var(--dim); position:relative; }
.tab svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:square; stroke-linejoin:miter; }
.tab.on{ color:#000; background:var(--ink); }
.tab .badge{ position:absolute; top:5px; left:calc(50% + 5px); min-width:16px; height:16px; padding:0 3px; background:var(--ink); color:#000; border:2px solid #000; font-family:var(--pixel); font-size:7px; line-height:12px; text-align:center; }
.tab.on .badge{ background:#000; color:var(--ink); border-color:var(--ink); }

/* ═════════ 대화창 ═════════ */
.chat-head{ position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 14px 12px; background:#000; border-bottom:2px solid var(--ink); }
.chat-head .exit{ background:none; border:2px solid var(--ink); color:var(--ink); width:34px; height:34px; font-size:18px; line-height:1; padding:0; flex:none; }
.chat-head .exit:active{ background:var(--ink); color:#000; }
.chat-head .title{ flex:1; min-width:0; }
.chat-head .title b{ display:block; font-size:15px; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-head .title small{ display:flex; gap:8px; align-items:baseline; font-size:12px; color:var(--dim); margin-top:3px; }
.chat-head .title small .px{ font-size:8px; color:var(--ink); }
/* 게임 체력바 */
.progress{ display:flex; gap:2px; margin:9px 3px 3px; padding:3px; border:2px solid var(--ink); box-shadow:0 0 0 2px #000, 0 0 0 3px var(--ink); }
.progress i{ flex:1; height:7px; background:transparent; }
.progress i.done, .progress i.now{ background:var(--ink); }
.pinned{ margin:10px 12px 0; padding:10px 12px; border:2px solid var(--ink); display:flex; gap:8px; font-size:14px; line-height:1.5; }
.pinned span{ flex:none; font-family:var(--pixel); font-size:8px; line-height:22px; }

.thread{ padding:14px 12px 8px; display:flex; flex-direction:column; gap:14px; }
.notice{ align-self:center; font-size:12px; color:var(--dim); padding:2px 10px; border:1px solid var(--dim); text-align:center; }
.msg{ display:flex; gap:8px; max-width:100%; }
.msg.them .av{ width:36px; height:36px; flex:none; border:2px solid var(--ink); position:relative; background:#000; }
.msg.them .av::before{ content:""; position:absolute; left:7px; top:9px; width:4px; height:6px; background:var(--ink); box-shadow:14px 0 0 var(--ink); }
.msg.them .av::after{ content:""; position:absolute; left:7px; top:21px; width:18px; height:3px; background:var(--ink); }
.msg .col{ display:flex; flex-direction:column; gap:5px; min-width:0; max-width:calc(100% - 44px); }
.msg .name{ font-size:12px; color:var(--dim); }
.b-row{ display:flex; align-items:flex-end; gap:6px; }
.bubble{ padding:8px 11px; border:2px solid var(--ink); background:#000; font-size:15px; line-height:1.55; white-space:pre-wrap; min-width:0; }
.time{ font-family:var(--pixel); font-size:7px; color:var(--dim); flex:none; white-space:nowrap; padding-bottom:3px; }
.msg.me{ justify-content:flex-end; }
.msg.me .col{ align-items:flex-end; max-width:84%; }
.msg.me .b-row{ flex-direction:row-reverse; }
.msg.me .bubble{ background:var(--ink); color:#000; }
.msg.me.dim .bubble{ background:#000; color:var(--ink); border-style:dashed; }
.msg .cap{ font-size:12px; color:var(--dim); }
.bubble .qq{ padding:7px 9px; border:1px dashed var(--ink); font-size:15px; }
.bubble.none{ color:var(--dim); }
.msg.me .bubble.none{ background:#000; color:var(--dim); border-color:var(--dim); border-style:dashed; }
.replies{ margin-left:44px; display:flex; flex-direction:column; gap:7px; }

/* 입력창 */
.composer{ position:fixed; left:0; right:0; bottom:0; z-index:12; background:#000; border-top:2px solid var(--ink); padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)); }
.composer-in{ max-width:640px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; }
.composer-in.nextbar{ justify-content:space-between; align-items:center; margin-bottom:8px; }
.nextbar .btn.ghost{ padding:0 2px; font-size:12px; }
.nextbar .btn.ghost:disabled{ opacity:0; }
.composer .plus{ flex:none; width:24px; height:40px; display:grid; place-items:center; color:var(--dim); font-family:var(--pixel); font-size:14px; }
.composer textarea{ flex:1; min-height:42px; max-height:38vh; resize:none; padding:9px 12px; font-size:15px; line-height:1.45; overflow-y:auto; }
.composer .send{ flex:none; min-height:42px; padding:0 13px; border:2px solid var(--ink); background:var(--ink); color:#000; font-size:14px; white-space:nowrap; }
.composer .send:active:not(:disabled){ background:#000; color:var(--ink); }
.composer .send:disabled{ background:#000; border-color:var(--dim); color:var(--dim); cursor:not-allowed; }

/* 공부 모드: 타이머가 주인공 */
.timer{ align-self:center; font-family:var(--pixel); font-size:clamp(40px,15vw,88px); line-height:1; margin:22px 0 6px; }
.timer-label{ align-self:center; font-size:12px; color:var(--dim); margin-top:-4px; }
.capture-btns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.capture{ min-height:84px; border:2px solid var(--ink); background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:15px; }
.capture .ico{ font-size:22px; line-height:1; }
.capture.on, .capture:active{ background:var(--ink); color:#000; }
.capture-input{ display:flex; gap:8px; }
.capture-input input{ flex:1; }
.study-end{ padding:6px 12px 24px; }

.compare{ display:flex; flex-direction:column; gap:14px; }
@media (min-width:760px){ .compare{ display:grid; grid-template-columns:1fr 1fr; align-items:start; } .compare .msg.me .col{ max-width:100%; } }

/* 자기평가: 선택하면 반전 */
.choice{ display:flex; align-items:center; gap:12px; width:100%; text-align:left; min-height:54px; padding:9px 12px; border:2px solid var(--ink); background:#000; }
.choice:active{ background:var(--ink); color:#000; }
.choice .lvl{ display:flex; gap:2px; flex:none; padding:2px; border:2px solid currentColor; }
.choice .lvl i{ width:6px; height:14px; background:transparent; }
.choice .lvl i.f{ background:currentColor; }
.choice .lvl i.d{ background:var(--dither); }
.choice .txt{ flex:1; min-width:0; }
.choice .txt b{ display:block; font-size:15px; }
.choice .txt small{ display:block; font-size:12px; color:var(--dim); margin-top:1px; }
.choice.sel{ background:var(--ink); color:#000; }
.choice.sel .txt small{ color:#000; }
.choice.familiar.sel{ background:#000; color:var(--ink); border-style:dashed; box-shadow:0 0 0 2px #000, 0 0 0 4px var(--ink); }
.choice.familiar.sel .txt small{ color:var(--ink); }
.choice.familiar.sel .lvl i.d{ background:var(--dither); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ min-height:40px; padding:0 12px; border:2px solid var(--ink); background:#000; font-size:14px; }
.chip.sel, .chip:active{ background:var(--ink); color:#000; }
.choices{ display:flex; flex-direction:column; gap:7px; }

/* 이해 레벨 */
.levels{ padding:12px; border:2px solid var(--ink); }
.levels-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:10px; }
.levels-head span{ font-size:12px; color:var(--dim); }
.levels-head strong{ font-size:15px; }
.levels-head strong em{ font-style:normal; font-family:var(--pixel); font-size:12px; margin-right:4px; }
.ladder{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.rung{ padding:9px 4px 8px; border:2px solid var(--dim); text-align:center; color:var(--dim); }
.rung em{ display:block; font-style:normal; font-family:var(--pixel); font-size:16px; line-height:1; margin-bottom:6px; }
.rung b{ display:block; font-size:12px; line-height:1.3; }
.rung.half{ border:2px dashed var(--ink); color:var(--ink); }
.rung.lit{ border-color:var(--ink); background:var(--ink); color:#000; }

/* AI 프롬프트 */
.ai-box{ margin-top:10px; padding:12px; border:2px dashed var(--ink); }
.ai-box p{ margin:0 0 10px; font-size:12px; color:var(--dim); }
.ai-btns{ display:grid; gap:7px; }
.ai-btn{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; min-height:50px; padding:8px 12px; border:2px solid var(--ink); background:#000; font-size:14.5px; }
.ai-btn:active{ background:var(--ink); color:#000; }
.ai-btn:active .t small{ color:#000; }
.ai-btn .ic{ font-family:var(--pixel); font-size:9px; line-height:1; width:26px; text-align:center; }
.ai-btn .t{ flex:1; min-width:0; }
.ai-btn .t small{ display:block; font-size:12px; color:var(--dim); }
.ai-btn .cp{ font-family:var(--pixel); font-size:8px; padding:4px 6px; background:var(--ink); color:#000; }
.ai-btn:active .cp{ background:#000; color:var(--ink); }
.ai-btn.hl{ border-width:3px; box-shadow:0 0 0 2px #000, 0 0 0 4px var(--ink); }
.sheet-bg{ position:fixed; inset:0; background:#000; z-index:40; display:flex; align-items:flex-end; justify-content:center; }
.sheet{ width:100%; max-width:640px; background:#000; border-top:3px solid var(--ink); padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px)); }
.sheet h2{ font-size:17px; margin:0 0 6px; }
.sheet textarea{ min-height:240px; font-size:13px; }

.starter{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
.starter button{ font-size:12.5px; min-height:32px; padding:0 10px; border:1px dashed var(--ink); background:#000; color:var(--ink); }
.starter button:active{ background:var(--ink); color:#000; }
.field-label{ display:block; font-size:13px; margin:14px 0 6px; color:var(--dim); }
.form-block{ margin-left:44px; }
.flow-cta{ margin-top:18px; }

/* 완료 */
.done-mark{ font-family:var(--pixel); font-size:clamp(20px,7vw,32px); line-height:1.2; margin:36px 0 22px; }
.prompt{ font-size:21px; line-height:1.35; margin:0 0 8px; }
.helper{ color:var(--dim); font-size:13.5px; margin:0 0 18px; }
.summary{ display:flex; flex-direction:column; margin:22px 0; border:2px solid var(--ink); }
.summary div{ display:flex; justify-content:space-between; gap:12px; padding:11px 13px; font-size:14px; border-top:1px dashed var(--dim); }
.summary div:first-child{ border-top:0; }
.summary span{ color:var(--dim); }
.pad{ padding:0 16px; }

.kv{ display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:13px; }
.kv dt{ color:var(--dim); } .kv dd{ margin:0; }
.seg{ display:inline-flex; border:2px solid var(--ink); margin-bottom:14px; }
.seg button{ border:0; background:#000; min-height:34px; padding:0 12px; font-size:13.5px; color:var(--dim); }
.seg button.on{ background:var(--ink); color:#000; }
.toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:#000; border:2px solid #000; box-shadow:0 0 0 2px var(--ink); padding:8px 14px; font-size:13px; z-index:30; max-width:calc(100% - 40px); }
.muted{ color:var(--dim); } .faint{ color:var(--dim); } .small{ font-size:12px; }
.mt8{ margin-top:8px; } .mt16{ margin-top:16px; } .mt24{ margin-top:24px; }
.hidden{ display:none!important; }
.danger{ color:var(--dim); }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>
<div id="sheet-root"></div>

<script>
/* ════════════════════════════════════════════════════════════════
   Learning Loop — 브라우저 전용 MVP
   구조: Store(데이터) · Remote(claude.ai 저장소 동기화) · AI(향후 연결 지점)
         · Views(화면별 렌더 함수) · Actions(이벤트 처리)
   ════════════════════════════════════════════════════════════════ */

const LS_KEY = 'learning-loop:v1';
const REVIEW_INTERVALS = [1, 3, 7, 30]; // 일 단위
const LONG_TERM_DAYS = 60;
const DAY = 86400000;

/* 흐름 단계 (완료 화면 제외 7단계가 진행바) */
const STEPS = ['question','attempt','study','recall','compare','assess','transfer'];
const STEP_LABEL = { question:'질문', attempt:'먼저 답하기', study:'공부', recall:'다시 꺼내기', compare:'전과 후', assess:'자기평가', transfer:'응용' };

const $ = (s, el=document) => el.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function fmtDate(ts){ const d=new Date(ts); return `${d.getMonth()+1}월 ${d.getDate()}일`; }
function fmtDateFull(ts){ const d=new Date(ts); return `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; }
function fmtDur(sec){ sec=Math.max(0,Math.round(sec||0)); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60); if(h) return `${h}시간 ${m}분`; if(m) return `${m}분`; return `${sec}초`; }
function fmtClock(ms){ const s=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; const p=n=>String(n).padStart(2,'0'); return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`; }
function startOfDay(ts){ const d=new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
function relDue(ts){ const diff=Math.round((startOfDay(ts)-startOfDay(Date.now()))/DAY); if(diff<=0) return '오늘'; if(diff===1) return '내일'; return `${diff}일 후`; }
function startOfWeek(){ const d=new Date(); d.setHours(0,0,0,0); const day=(d.getDay()+6)%7; return d.getTime()-day*DAY; }
function toast(msg){ const r=$('#toast-root'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML='',2200); }

function newSession(question='', sourceInboxId=null){
  const now=Date.now();
  return {
    id:uid(), createdAt:now, updatedAt:now, status:'draft', step:'question',
    question, sourceInboxId,
    startedAt:now, studyStartedAt:null, studyEndedAt:null, endedAt:null, pausedMs:0, pausedAt:null, studyDurationSec:0,
    initialAnswer:'', notes:{ learned:[], questions:[] }, chat:{},
    recallAnswer:'', changeNote:'',
    assessment:{ retrieval:null, transfer:null, nextAction:null, ambiguity:'' },
    flags:{ needsExamples:false, notMastered:false, keepForReview:false },
    transfer:{ question:'', answer:'', skipped:false, source:'user' },
    review:{ stage:0, nextDue:null, history:[] },
  };
}

/* ───────── Store ───────── */
const Store = {
  state:{ version:1, sessions:{}, inbox:{}, draft:null, metaUpdatedAt:0 },
  dirty:new Set(),
  load(){
    try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const s=JSON.parse(raw); this.state=Object.assign(this.state,s); } }catch(e){}
  },
  saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(this.state)); }catch(e){} },
  commit(){ this.saveLocal(); Remote.schedule(); },
  putSession(s){ s.updatedAt=Date.now(); this.state.sessions[s.id]=s; this.dirty.add('s:'+s.id); this.commit(); },
  removeSession(id){ delete this.state.sessions[id]; this.dirty.add('del:'+id);
    for(const it of Object.values(this.state.inbox)) if(it.sessionId===id) delete this.state.inbox[it.id];
    this.touchMeta(); },
  touchMeta(){ this.state.metaUpdatedAt=Date.now(); this.dirty.add('meta'); this.commit(); },
  get draft(){ return this.state.draft; },
  saveDraft(){ if(this.state.draft) this.state.draft.updatedAt=Date.now(); this.touchMeta(); },
  addInbox(text, kind, sessionId){
    text=(text||'').trim(); if(!text) return;
    const now=Date.now(); const id=uid();
    this.state.inbox[id]={ id, text, kind, sessionId, createdAt:now, updatedAt:now, status:'open', startedSessionId:null };
  },
  setInbox(id, patch){ const it=this.state.inbox[id]; if(!it) return; Object.assign(it,patch,{updatedAt:Date.now()}); },
  sessionsList(){ return Object.values(this.state.sessions).filter(s=>s.status==='completed').sort((a,b)=>b.createdAt-a.createdAt); },
  openInbox(){ return Object.values(this.state.inbox).filter(i=>i.status!=='resolved').sort((a,b)=>b.createdAt-a.createdAt); },
  dueReviews(){ const end=startOfDay(Date.now())+DAY; return this.sessionsList().filter(s=>s.review.nextDue && s.review.nextDue<end).sort((a,b)=>a.review.nextDue-b.review.nextDue); },
  replaceAll(data){ this.state=Object.assign({ version:1, sessions:{}, inbox:{}, draft:null, metaUpdatedAt:0 }, data);
    this.dirty.add('meta'); for(const id in this.state.sessions) this.dirty.add('s:'+id); this.commit(); },
};

/* ───────── Remote: claude.ai 개인 저장소 동기화 (없으면 이 브라우저에만 저장) ─────────
   경로: data/users/<내 id>/meta  ·  data/users/<내 id>/s_<세션id>
   → 나중에 Supabase로 옮길 때는 이 객체만 교체하면 됩니다. */
const Remote = {
  db:null, uid:null, ready:false, timer:null, busy:false,
  async init(){
    if(window.top===window) return; // 직접 호스팅한 앱: 이 기기에 저장
    for(let i=0;i<20 && !(window.claude && window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
    if(!(window.claude && window.claude.use)) return;
    try{
      const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
      if(!db||!user) return;
      const id=await user.id(); if(!id) return;
      this.db=db; this.uid=id;
      const snap=await db.collection('data/users/'+id).limit(1000).get();
      this.merge(snap.docs);
      this.ready=true; render(); this.schedule(0);
    }catch(e){ this.ready=false; }
  },
  merge(docs){
    const st=Store.state; const remoteIds=new Set();
    for(const d of docs){
      if(!d.exists) continue; const data=d.data();
      if(d.id==='meta'){
        const rInbox=data.inbox||{};
        for(const k in rInbox){ const l=st.inbox[k]; if(!l || (rInbox[k].updatedAt||0)>(l.updatedAt||0)) st.inbox[k]=clone(rInbox[k]); }
        for(const k in st.inbox){ if(!rInbox[k] || (st.inbox[k].updatedAt||0)>(rInbox[k].updatedAt||0)) Store.dirty.add('meta'); }
        const rd=data.draft||null, ld=st.draft;
        if(rd && (!ld || (rd.updatedAt||0)>(ld.updatedAt||0))) st.draft=clone(rd);
        else if(ld && (!rd || (ld.updatedAt||0)>(rd.updatedAt||0))) Store.dirty.add('meta');
      } else if(d.id.startsWith('s_')){
        const sid=d.id.slice(2); remoteIds.add(sid);
        const l=st.sessions[sid];
        if(!l || (data.updatedAt||0)>(l.updatedAt||0)) st.sessions[sid]=clone(data);
        else if((l.updatedAt||0)>(data.updatedAt||0)) Store.dirty.add('s:'+sid);
      }
    }
    for(const sid in st.sessions) if(!remoteIds.has(sid)) Store.dirty.add('s:'+sid);
    if(!docs.some(d=>d.id==='meta')) Store.dirty.add('meta');
    Store.saveLocal();
  },
  schedule(delay=800){ if(!this.ready) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.flush(),delay); },
  async flush(){
    if(!this.ready||this.busy) return; this.busy=true;
    const col=this.db.collection('data/users/'+this.uid);
    try{
      while(Store.dirty.size){
        const key=Store.dirty.values().next().value; Store.dirty.delete(key);
        try{
          if(key==='meta'){ const st=Store.state; await col.doc('meta').set(clone({ inbox:st.inbox, draft:st.draft||null, metaUpdatedAt:st.metaUpdatedAt })); }
          else if(key.startsWith('s:')){ const s=Store.state.sessions[key.slice(2)]; if(s) await col.doc('s_'+s.id).set(clone(s)); }
          else if(key.startsWith('del:')){ await col.doc('s_'+key.slice(4)).delete(); }
        }catch(e){
          if(e && (e.code==='unavailable'||e.code==='resource_exhausted')){ Store.dirty.add(key); setTimeout(()=>this.flush(),3000+Math.random()*2000); break; }
          if(e && (e.code==='revoked'||e.code==='not_granted'||e.code==='invalid_argument')){ this.ready=false; render(); break; }
        }
      }
    } finally { this.busy=false; }
  },
};

const PROMPT_KINDS = {
  apply:     { icon:'Q', label:'응용 문제 받기',  hint:'조건을 바꾼 문제로 적용해보기' },
  example:   { icon:'EX', label:'예시 더 받기',    hint:'헷갈린 지점이 드러나는 구체적 예시' },
  reexplain: { icon:'RE', label:'다시 설명받기',   hint:'내 답의 빈틈부터 짚고 다른 방식으로' },
};
function buildPrompt(kind, s){
  const a=s.assessment||{};
  const lines=[];
  const add=(title,body)=>{ body=(body||'').trim(); if(body) lines.push(`[${title}]\n${body}`); };
  add('학습 질문', s.question);
  add('공부 전 내 답 (자료 보기 전)', s.initialAnswer || '(비워둠)');
  add('공부 중 알게 된 것', (s.notes?.learned||[]).map(n=>'- '+n.text).join('\n'));
  add('공부 중 새로 생긴 질문', (s.notes?.questions||[]).map(n=>'- '+n.text).join('\n'));
  add('공부 후 자료 없이 다시 설명한 답', s.recallAnswer);
  add('달라진 점', s.changeNote);
  const self=[];
  if(a.retrieval) self.push('설명: '+retrievalLabel(a.retrieval));
  if(a.transfer) self.push('적용: '+transferLabel(a.transfer));
  add('내 자기평가', self.join('\n'));
  add('아직 애매한 점', a.ambiguity);
  if(s.transfer?.question?.trim()) add('내가 만든 응용 문제와 내 답', `문제: ${s.transfer.question}\n내 답: ${s.transfer.answer||'(없음)'}`);
  const ctx=lines.join('\n\n');
  const intro='나는 스스로 학습하는 능력을 기르는 중이야. 아래는 이번 학습에서 내가 직접 기록한 내용이야.';
  const tasks={
    apply:`[요청]
위 기록을 바탕으로, 이 개념을 조금 다른 상황에 적용해야 풀 수 있는 응용 문제 3개를 만들어줘.
- 1번: 조건 하나를 바꾼 상황
- 2번: 예외나 반례가 되는 상황
- 3번: 비슷한 개념과 비교하거나 "만약 ~라면"을 묻는 상황
내 답과 자기평가에서 약해 보이는 부분을 겨냥해줘.
정답과 해설은 아직 주지 마. 문제만 먼저 주고, 내가 답하면 그때 무엇이 맞고 무엇이 빠졌는지 피드백해줘.`,
    example:`[요청]
위 기록을 바탕으로, 이 개념을 이해하는 데 도움이 되는 구체적인 예시 2~3개를 보여줘.
- 내가 헷갈려하는 지점(애매한 점, 새로 생긴 질문)이 드러나는 예시를 우선해줘.
- 전형적인 예시 하나와, 겉보기엔 비슷하지만 결과가 다른 예시 하나를 꼭 포함해줘.
- 각 예시 끝에 "여기서 핵심 원리"를 한 줄로 정리해줘.
마지막에 내가 예시를 보고 원리를 스스로 말해볼 수 있게 확인 질문 1개를 던져줘.`,
    reexplain:`[요청]
먼저 "공부 후 자료 없이 다시 설명한 답"을 검토해서, 틀린 부분·빠진 부분·모호한 부분을 구체적으로 짚어줘. (맞은 부분은 짧게 인정만 해줘)
그다음 내가 처음 공부한 방식과는 다른 방식으로 다시 설명해줘. 비유, 단계별 흐름, 또는 원인→결과 구조 중 이 내용에 가장 맞는 것을 골라줘.
설명은 핵심 위주로 간결하게 해주고, 마지막에 내가 자료 없이 다시 설명해볼 수 있도록 질문 1개를 던져줘. 정답은 내가 답한 뒤에 알려줘.`,
  };
  return `${intro}\n\n${ctx}\n\n${tasks[kind]}`;
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){}
  try{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length); const ok=document.execCommand('copy'); ta.remove(); if(ok) return true; }catch(e){}
  return false;
}

/* ───────── 지표 계산 (인사이트 확장용으로 분리) ───────── */
function computeMetrics(){
  const list=Store.sessionsList(); const wk=startOfWeek();
  let recallWeek=0, transferDone=0, reviewsDone=0, good=0, familiar=0, shaky=0, studySec=0;
  for(const s of list){
    if(s.recallAnswer && (s.studyEndedAt||s.createdAt)>=wk) recallWeek++;
    if(s.transfer && s.transfer.answer && s.transfer.answer.trim()) transferDone++;
    for(const h of s.review.history){ reviewsDone++; if(h.rating==='good') good++; if(h.at>=wk) recallWeek++; }
    if(s.assessment.retrieval==='familiar') familiar++;
    if(s.assessment.transfer==='shaky') shaky++;
    studySec+=s.studyDurationSec||0;
  }
  return { completed:list.length, recallWeek, transferDone, reviewsDone,
    goodRate: reviewsDone? Math.round(good/reviewsDone*100):null,
    openInbox:Store.openInbox().length, studySec,
    familiarRate: list.length? Math.round(familiar/list.length*100):null,
    shakyRate: list.length? Math.round(shaky/list.length*100):null,
    transferRate: list.length? Math.round(transferDone/list.length*100):null, total:list.length };
}

  const app=$('#app');

  if(v==='flow') html=viewFlow();
  else if(v==='review') html=viewReviewFlow();

    html = `<div class="wrap">${body}</div>${viewTabs()}`;
  }
  app.innerHTML=html;
  if(v==='flow' && Store.draft && Store.draft.step==='study'){
    const el=$('#timer'); const d=Store.draft;
    const tick=()=>{ if(el) el.textContent=fmtClock(Date.now()-d.studyStartedAt-(d.pausedMs||0)); };
    tick(); tickTimer=setInterval(tick,1000);

  document.querySelectorAll('[data-grow]').forEach(grow);
  const af=$('[data-autofocus]'); if(af && !('ontouchstart' in window)) af.focus();

  home:'<path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  reviews:'<path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/>',
  inbox:'<circle cx="12" cy="12" r="8"/><path d="M9.7 9.5a2.4 2.4 0 1 1 3.2 2.3c-.6.3-.9.8-.9 1.4"/><path d="M12 16.3v.2"/>',
  history:'<path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  data:'<path d="M12 4v11"/><path d="M8 11l4 4 4-4"/><path d="M5 20h14"/>',
};
function viewTabs(){
  const due=Store.dueReviews().length, open=Store.openInbox().length;
  const t=(k,label,badge)=>`<button class="tab ${UI.view===k||(k==='history'&&UI.view==='detail')?'on':''}" data-act="nav" data-to="${k}" aria-label="${label}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${label}${badge?`<span class="badge">${badge}</span>`:''}</button>`;
  return `<nav class="tabs"><div class="tabs-in">${t('home','홈')}${t('reviews','복습',due)}${t('inbox','모르는 것',open)}${t('history','기록')}${t('data','데이터')}</div></nav>`;
}
function topbar(){
  return `<div class="topbar"><div></div>
  <div class="sync ${Remote.ready?'on':''}" title="${Remote.ready?'claude.ai 계정에 저장 중':'이 브라우저에 저장 중'}"><i></i>${Remote.ready?'계정에 저장됨':'이 기기에 저장됨'}</div></div>`;
}
function reviewStatus(s){
  if(!s.review.nextDue) return '복습 없음';
  if(s.review.stage>=REVIEW_INTERVALS.length) return `장기 기억 · ${relDue(s.review.nextDue)} 확인`;
  return `복습 ${relDue(s.review.nextDue)}`;
}
function retrievalLabel(k){ const r=RETRIEVAL.find(x=>x.key===k); return r?r.label:'—'; }
function transferLabel(k){ const r=TRANSFER.find(x=>x.key===k); return r?r.label:'—'; }

/* ════════════════ 화면: 홈 ════════════════ */
function viewHome(){
  const d=Store.draft; const m=computeMetrics();
  const due=Store.dueReviews(); const open=Store.openInbox();
  let h=topbar();
  if(d){
    h+=`<div class="card resume"><div class="label">진행 중인 학습 · ${STEP_LABEL[d.step]||''}</div>
      <div class="q">${d.question?esc(d.question):'<span class="faint">아직 질문을 적지 않았어요</span>'}</div>
      <div class="row"><button class="btn primary" data-act="resume">이어하기</button><button class="btn ghost" data-act="discard">버리기</button></div></div>`;
  } else {
    h+=`<button class="btn primary block lg cta" data-act="start">학습 시작<span class="px blink">PRESS START</span></button>`;
  }

  h+=`<div class="section"><div class="section-head"><h2>오늘 복습할 항목</h2>${due.length>3?`<button class="more" data-act="nav" data-to="reviews">전체 ${due.length}개</button>`:''}</div>`;
  h+= due.length ? `<div class="list">${due.slice(0,3).map(s=>`<button class="item rv" data-act="review" data-id="${s.id}"><div class="q">${esc(s.question)}</div><div class="meta"><span>${fmtDate(s.createdAt)} 학습</span><span>${s.review.history.length+1}번째 복습</span></div></button>`).join('')}</div>`
    : `<div class="empty">오늘 복습할 항목이 없어요. 학습을 마치면 다음 날부터 복습이 잡힙니다.</div>`;
  h+=`</div>`;

  h+=`<div class="section"><div class="section-head"><h2>아직 모르는 것</h2>${open.length>3?`<button class="more" data-act="nav" data-to="inbox">전체 ${open.length}개</button>`:''}</div>`;
  h+= open.length ? `<div class="list">${open.slice(0,3).map(inboxItemHTML).join('')}</div>`
    : `<div class="empty">공부 중 생긴 질문과 애매한 점이 여기에 모입니다.</div>`;
  h+=`</div>`;

  h+=`<div class="section"><div class="section-head"><h2>학습 지표</h2></div>
    <div class="metrics">
      <div class="metric"><b>${m.completed}</b><small>완료한 학습 질문</small></div>
      <div class="metric"><b>${m.recallWeek}</b><small>이번 주 Recall</small></div>
      <div class="metric"><b>${m.transferDone}</b><small>응용 문제 완료</small></div>
      <div class="metric"><b>${m.reviewsDone}</b><small>복습 완료</small></div>
      <div class="metric"><b>${m.goodRate==null?'—':m.goodRate+'%'}</b><small>잘 기억남 비율</small></div>
      <div class="metric"><b>${m.openInbox}</b><small>아직 애매한 항목</small></div>
    </div>
    <div class="metric-foot"><span>누적 공부 시간 ${fmtDur(m.studySec)}</span>${m.total?`<span>응용 완료율 ${m.transferRate}%</span>`:''}</div>
    ${insightHTML(m)}</div>`;
  return h;
}
function insightHTML(m){
  if(m.total<3) return '';
  if(m.familiarRate>=25) return `<div class="insight">최근 학습의 <b>${m.familiarRate}%</b>에서 “보면 이해되는데 혼자 못 꺼냄”을 선택했습니다. 다음 학습에서는 공부 도중에 자료를 덮고 한 번 꺼내보세요.</div>`;
  if(m.shakyRate>=25) return `<div class="insight">최근 학습의 <b>${m.shakyRate}%</b>에서 “조금만 바뀌면 헷갈림”을 선택했습니다. 응용 문제를 하나씩 붙여보면 좋습니다.</div>`;
  return '';
}
function inboxItemHTML(it){
  const src=Store.state.sessions[it.sessionId];
  return `<div class="item ib"><div class="q">${esc(it.text)}</div>
    <div class="meta"><span class="pill ${it.kind==='newQuestion'?'lamp':''}">${INBOX_KIND[it.kind]||''}</span><span>${fmtDate(it.createdAt)}</span>${src&&src.question!==it.text?`<span>출처: ${esc(src.question.slice(0,28))}${src.question.length>28?'…':''}</span>`:''}${it.status==='started'?'<span>학습 중</span>':''}</div>
    <div class="actions"><button class="btn sm primary" data-act="startFromInbox" data-id="${it.id}">이걸로 학습 시작</button>${it.status!=='resolved'?`<button class="btn sm ghost" data-act="resolveInbox" data-id="${it.id}">해결됨</button>`:''}<button class="btn sm ghost danger" data-act="deleteInbox" data-id="${it.id}">삭제</button></div></div>`;
}

/* ════════════════ 화면: 학습 흐름 (카카오톡 대화창) ════════════════ */
const BOT_NAME='러닝루프';
function hm(ts){ const d=new Date(ts||Date.now()); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function dayNotice(ts){ const d=new Date(ts||Date.now()); return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; }
function them(parts, ts, name=true){
  return `<div class="msg them"><div class="av" aria-hidden="true"></div><div class="col">${name?`<div class="name">${BOT_NAME}</div>`:''}
    ${parts.map((p,i)=>`<div class="b-row"><div class="bubble">${p}</div>${i===parts.length-1&&ts?`<span class="time">${hm(ts)}</span>`:''}</div>`).join('')}</div></div>`;
}
function me(parts, ts, opt={}){
  return `<div class="msg me ${opt.dim?'dim':''}"><div class="col">${opt.cap?`<div class="cap">${opt.cap}</div>`:''}
    ${parts.map((p,i)=>`<div class="b-row"><div class="bubble ${opt.none?'none':''}">${p}</div>${i===parts.length-1&&ts?`<span class="time">${hm(ts)}</span>`:''}</div>`).join('')}</div></div>`;
}
const notice = t => `<div class="notice">${t}</div>`;
function chatHead(step, exitAct='exitFlow', title){
  const idx=STEPS.indexOf(step);
  return `<div class="chat-head"><button class="exit" data-act="${exitAct}" aria-label="나가기">‹</button>
    <div class="title"><b>${title||BOT_NAME}</b>${idx>=0?`<small><span class="px">STAGE ${idx+1}/7</span>${STEP_LABEL[step]}</small><div class="progress" aria-hidden="true">${STEPS.map((x,i)=>`<i class="${i<idx?'done':i===idx?'now':''}"></i>`).join('')}</div>`:''}</div></div>`;
}
/* 입력창: 전송 = 말풍선 추가 / 다음 단계는 위쪽 버튼으로 */
function composer(field, placeholder, next){
  // next = { act, label, need(필드 경로) | ready(boolean) }
  const msgs = UI.view==='review' ? (UI.review.msgs||[]) : msgsOf(Store.draft, field);
  const needOk = next.need ? !!String(getPath(Store.draft,next.need)||'').trim() : (next.ready!==false);
  return `<div class="composer"><div class="composer-in nextbar">
      <button class="btn sm ghost" data-act="undoMsg" ${msgs.length?'':'disabled'}>방금 보낸 말 취소</button>
      <button class="btn sm primary" id="nextBtn" data-act="${next.act}" ${next.need?`data-need="${next.need}"`:''} ${next.ready===false?'data-lock="1"':''} ${needOk?'':'disabled'}>다 적었으면 ${next.label}</button></div>
    <div class="composer-in"><span class="plus" aria-hidden="true">+</span>
    <textarea rows="1" id="composerIn" data-field="${field}" data-grow data-autofocus placeholder="${placeholder}"></textarea>
    <button class="send" data-act="sendMsg" disabled aria-label="전송">전송</button></div></div>`;
}
function getPath(obj,path){ return path.split('.').reduce((o,k)=>o?o[k]:undefined,obj); }
function msgsOf(s, field){
  if(!s) return [];
  if(s.chat && s.chat[field]) return s.chat[field];
  const v=String(getPath(s,field)||'').trim();
  return v ? [{text:v, at:s.updatedAt||s.createdAt}] : [];
}
function myMsgs(s, field, opt={}){ return msgsOf(s,field).map(m=>me([esc(m.text)], m.at, opt)).join(''); }
function bottomBar(act,label){ return `<div class="composer"><div class="composer-in"><button class="btn primary block" data-act="${act}">${label}</button></div></div>`; }
function viewFlow(){
  if(UI.params.done) return viewDone(Store.state.sessions[UI.params.done]);
  const d=Store.draft; if(!d) { UI.view='home'; return `<div class="wrap">${viewHome()}</div>`; }
  const s=d.step;
  let h=`<div class="wrap flow ${s==='compare'?'wide':''}">${chatHead(s)}`;
  if(s==='study' || s==='recall' || s==='compare' || s==='assess' || s==='transfer'){}
  let t='';

  if(s==='question'){
    t+=notice(dayNotice(d.startedAt));
    t+=them(['오늘 무엇을 알아내고 싶은가요?','주제보다 질문으로 적어보세요.'], d.startedAt);
    t+=myMsgs(d,'question');
    h+=`<div class="thread">${t}</div>`+composer('question', '질문으로 적어보세요', {act:'next', label:'다음', need:'question'});
  }
  else if(s==='attempt'){
    t+=notice(dayNotice(d.startedAt));
    t+=myMsgs(d,'question');
    t+=them(['자료를 보기 전에, 지금 아는 만큼 답해보세요.','틀려도 괜찮습니다. 지금 내 머릿속에 있는 것을 먼저 꺼내는 단계입니다.']);
    t+=myMsgs(d,'initialAnswer');
    h+=`<div class="thread">${t}</div>`+composer('initialAnswer', '떠오르는 대로 적어보세요', {act:'beginStudy', label:'공부 시작'});
  }
  else if(s==='study'){
    const c=UI.capture;
    const items=[...d.notes.learned.map(n=>({...n,t:'[!]'})),...d.notes.questions.map(n=>({...n,t:'[?]'}))].sort((a,b)=>a.at-b.at);
    h+=`<div class="pinned"><span>PIN</span><div>${esc(d.question)}</div></div>`;
    t+=`<div class="timer" id="timer" aria-live="off">00:00</div><div class="timer-label">공부 중 · ${hm(d.studyStartedAt)} 시작</div>`;
    t+=`<div class="capture-btns">
        <button class="capture ${c==='learned'?'on':''}" data-act="capture" data-type="learned"><span class="ico px">!</span>알게 된 것</button>
        <button class="capture ${c==='questions'?'on':''}" data-act="capture" data-type="questions"><span class="ico px">?</span>새로 생긴 질문</button></div>`;
    if(c) t+=`<div class="capture-input"><input type="text" id="capIn" data-autofocus placeholder="${c==='learned'?'한두 줄로 적고 Enter':'떠오른 질문을 적고 Enter'}" enterkeyhint="send"><button class="btn sm primary" data-act="saveCapture">전송</button></div>`;
    for(const n of items.slice(-8)) t+=me([`${n.t} ${esc(n.text)}`], n.at);
    h+=`<div class="thread">${t}</div><div class="study-end"><button class="btn block" data-act="endStudy">학습 종료</button></div>`;
  }
  else if(s==='recall'){
    t+=notice('자료를 덮었어요');
    t+=them(['자료를 보지 말고 다시 답해보세요.',`<div class="qq">${esc(d.question)}</div>`,'지금 이 질문에 답한다면 어떻게 설명하시겠어요?'], d.studyEndedAt);
    t+=myMsgs(d,'recallAnswer');
    h+=`<div class="thread">${t}</div>`+composer('recallAnswer', '친구에게 설명하듯 적어보세요', {act:'next', label:'답변 완료', need:'recallAnswer'});
  }
  else if(s==='compare'){
    const a=d.initialAnswer.trim(), b=d.recallAnswer.trim();
    t+=them([`<div class="qq">${esc(d.question)}</div>`,'공부 전과 후, 내 답을 나란히 볼게요.']);
    t+=`<div class="compare">${me([a?esc(a):'비워두었어요'], d.studyStartedAt, {dim:true, none:!a, cap:`공부 전 · ${a.length}자`})}${me([esc(b)], d.studyEndedAt, {cap:`공부 후 · ${b.length}자`})}</div>`;
    h+=`<div class="thread">${t}</div>`+bottomBar('next','자기평가');
  }
  else if(s==='assess'){
    const as=d.assessment;
    const choice=(opt,sel,field)=>`<button class="choice ${opt.key==='familiar'?'familiar':''} ${sel===opt.key?'sel':''}" data-act="pick" data-field="${field}" data-val="${opt.key}" aria-pressed="${sel===opt.key}">
      <span class="lvl" aria-hidden="true">${opt.bars.split('').map(c=>`<i class="${c==='f'?'f':c==='d'?'d':''}"></i>`).join('')}</span>
      <span class="txt"><b>${opt.label}</b>${opt.hint?`<small>${opt.hint}</small>`:''}</span></button>`;
    t+=them(['지금 이 내용을 어디까지 할 수 있나요?']);
    t+=`<div class="replies choices">${RETRIEVAL.map(o=>choice(o,as.retrieval,'retrieval')).join('')}</div>`;
    t+=them(['조금 다른 상황에도 적용할 수 있나요?']);
    t+=`<div class="replies choices">${TRANSFER.map(o=>choice(o,as.transfer,'transfer')).join('')}</div>`;
    t+=`<div class="replies">${ladderHTML(as)}</div>`;
    t+=them(['그럼 다음에는 무엇이 필요할까요?']);
    t+=`<div class="replies"><div class="chips">${NEXT_ACTIONS.map(o=>`<button class="chip ${as.nextAction===o.key?'sel':''}" data-act="pick" data-field="nextAction" data-val="${o.key}" aria-pressed="${as.nextAction===o.key}">${o.label}</button>`).join('')}</div>${aiBoxHTML(d, as.nextAction)}</div>`;
    t+=them(['남기고 싶은 애매한 점이 있나요? (선택)']);
    const ready=as.retrieval&&as.transfer&&as.nextAction;
    t+=myMsgs(d,'assessment.ambiguity');
    h+=`<div class="thread">${t}</div>`+composer('assessment.ambiguity', ready?'없으면 비워두고 다음':'위에서 먼저 골라주세요', {act:'toTransfer', label:'다음', ready:!!ready});
  }
  else if(s==='transfer'){
    const tr=d.transfer; const wants=d.assessment.nextAction==='apply';
    t+=them(['정말 이해했는지 다른 상황에서 확인해볼까요?','같은 질문을 반복하지 말고, 조건을 하나 바꿔 보세요.']);
    t+=`<div class="form-block">
      <label class="field-label" for="tq">응용 문제 직접 만들기</label>
      <div class="starter">${['만약 조건이 바뀐다면, ','예외적인 경우라면, ','비슷한 개념과 비교하면, ','실제 사례라면, '].map(x=>`<button data-act="starter" data-val="${x}">${x.replace(/, $/,'')}</button>`).join('')}</div>
      ${AI.enabled?`<button class="btn sm mt8" data-act="aiTransfer">응용 문제 추천받기</button>`:''}
      <textarea class="mid" id="tq" data-bind="transfer.question" placeholder="AI에게 받은 문제를 붙여넣어도 돼요">${esc(tr.question)}</textarea>
      <label class="field-label" for="ta">내 답</label>
      <textarea class="mid" id="ta" data-bind="transfer.answer" placeholder="자료를 보지 말고 답해보세요.">${esc(tr.answer)}</textarea>
      <div class="flow-cta"><button class="btn primary block" data-act="complete" data-skip="0" ${tr.question.trim()&&tr.answer.trim()?'':'disabled'}>저장하고 완료</button>
      <button class="btn ${wants?'ghost':''} block mt8" data-act="complete" data-skip="1">나중에 하기</button></div></div>`;
    h+=`<div class="thread">${t}</div>`;
  }
  return h+`</div>`;
}
/* 이해 레벨: 1 보면 안다 → 2 말할 수 있다 → 3 써먹을 수 있다 */
const LEVELS = [
  { n:1, name:'보면 안다' },
  { n:2, name:'말할 수 있다' },
  { n:3, name:'써먹을 수 있다' },
];
function levelState(as){
  const r=as.retrieval, t=as.transfer;
  return [
    r && r!=='unknown' ? 'lit' : '',
    r==='explain' ? 'lit' : r==='rough' ? 'half' : '',
    t==='new' ? 'lit' : t==='basic' ? 'half' : '',
  ];
}
function ladderHTML(as){
  const st=levelState(as);
  let cur=0; st.forEach((v,i)=>{ if(v==='lit') cur=i+1; });
  const head = !as.retrieval ? '선택하면 표시됩니다'
    : cur ? `<em>LV.${cur}</em> ${LEVELS[cur-1].name}` : '<em>LV.0</em> 아직 모른다';
  return `<div class="levels" aria-label="이해 레벨"><div class="levels-head"><span>지금 내 레벨</span><strong>${head}</strong></div>
    <div class="ladder">${LEVELS.map((l,i)=>`<div class="rung lv${l.n} ${st[i]}"><em>${l.n}</em><b>${l.name}</b></div>`).join('')}</div></div>`;
}
function viewDone(s){
  if(!s){ UI.view='home'; return `<div class="wrap">${viewHome()}</div>`; }
  const nq=s.notes.questions.length + (s.assessment.ambiguity.trim()?1:0);
  return `<div class="wrap flow"><div class="pad">
    <div class="done-mark blink" aria-hidden="true">COMPLETE!</div>
    <h1 class="prompt">오늘의 학습 루프 완료</h1>
    <p class="helper">오늘 답을 얻는 것보다, 다음에는 혼자 답할 가능성을 높이는 것이 목표입니다.</p>
    <div class="summary">
      <div><span>공부 시간</span>${fmtDur(s.studyDurationSec)}</div>
      <div><span>지금 할 수 있는 것</span>${retrievalLabel(s.assessment.retrieval)}</div>
      <div><span>아직 모르는 것에 추가</span>${nq}개</div>
      <div><span>첫 복습</span>${relDue(s.review.nextDue)}</div>
    </div>
    <div class="row"><button class="btn" data-act="openDetail" data-id="${s.id}">학습 기록 보기</button><button class="btn primary" data-act="finishDone">홈으로</button></div></div></div>`;
}

/* ════════════════ 화면: 복습 ════════════════ */
function viewReviews(){
  const due=Store.dueReviews();
  const later=Store.sessionsList().filter(s=>s.review.nextDue && !due.includes(s)).sort((a,b)=>a.review.nextDue-b.review.nextDue);
  let h=topbar()+`<h1 class="h-page">복습</h1><p class="sub">1일 · 3일 · 7일 · 30일 간격으로 다시 꺼내봅니다.</p>`;

function viewReviewFlow(){

  if(!s||!R){ UI.view='reviews'; return `<div class="wrap">${viewReviews()}</div>${viewTabs()}`; }

  let t=notice(dayNotice(Date.now()));
  t+=them(['지난번 질문입니다.',`<div class="qq">${esc(s.question)}</div>`,'답을 보기 전에 기억나는 만큼 적어보세요.']);
  if(R.phase==='write'){
    t+=(R.msgs||[]).map(m=>me([esc(m.text)], m.at)).join('');
    h+=`<div class="thread">${t}</div>`+composer('review', '기억나지 않는 부분은 비워도 돼요', {act:'revSubmit', label:'답 확인하기'});
  } else {
    t+=`<div class="compare">${me([esc(s.recallAnswer)], s.studyEndedAt||s.createdAt, {dim:true, cap:`지난번 공부 후 답변 · ${fmtDate(s.createdAt)}`})}${R.answer.trim()?me((R.msgs||[]).map(m=>esc(m.text)), R.at, {cap:'오늘 기억에서 꺼낸 답변'}):me(['비워두었어요'], R.at, {none:true, cap:'오늘 기억에서 꺼낸 답변'})}</div>`;
    if(R.phase==='reveal'){
      t+=them(['어느 정도 기억났나요?']);
      t+=`<div class="replies choices">${Object.entries(RATING).map(([k,v],i)=>`<button class="choice" data-act="revRate" data-val="${k}"><span class="lvl" aria-hidden="true">${['fff','ff_','f__'][i].split('').map(c=>`<i class="${c==='f'?'f':''}"></i>`).join('')}</span><span class="txt"><b>${v}</b><small>${['다음 복습 간격이 늘어납니다','같은 간격으로 한 번 더','내일 다시 확인합니다'][i]}</small></span></button>`).join('')}</div>`;
    } else {
      t+=me([RATING[R.rating]]);
      t+=them([`다음 복습은 ${relDue(s.review.nextDue)}입니다.${R.addedInbox?'\n여러 번 막힌 질문이라 ‘아직 모르는 것’에도 넣어두었어요.':''}`]);
      t+=`<div class="replies"><div class="row">${Store.dueReviews().length?`<button class="btn primary" data-act="nextReview">다음 복습</button>`:''}<button class="btn" data-act="nav" data-to="home">홈으로</button></div></div>`;
    }
    h+=`<div class="thread">${t}</div>`;
  }
  return h+`</div>`;
}

/* ════════════════ 동작 ════════════════ */
function armed(el,label){
  if(el.dataset.armed==='1') return true;
  el.dataset.armed='1'; const orig=el.textContent; el.textContent=label;
  setTimeout(()=>{ if(el.isConnected){ el.dataset.armed=''; el.textContent=orig; } },3500);
  return false;
}
function grow(el){ el.style.height='auto'; el.style.height=Math.min(el.scrollHeight, window.innerHeight*0.38)+'px'; }
function setPath(obj,path,val){ const k=path.split('.'); let o=obj; for(let i=0;i<k.length-1;i++) o=o[k[i]]; o[k[k.length-1]]=val; }

const Actions = {
  nav(el){ go(el.dataset.to); },
  navHistory(){ go('history'); },
  start(){ Store.state.draft=newSession(); Store.saveDraft(); go('flow'); },
  resume(){ const d=Store.draft; if(d && d.step==='study' && d.pausedAt){ d.pausedMs=(d.pausedMs||0)+(Date.now()-d.pausedAt); d.pausedAt=null; Store.saveDraft(); } go('flow'); },
  discard(el){ if(!armed(el,'한 번 더 누르면 버려요')) return;
    const d=Store.draft; if(d && d.sourceInboxId) Store.setInbox(d.sourceInboxId,{status:'open',startedSessionId:null});
    Store.state.draft=null; Store.touchMeta(); render(); },
  exitFlow(){ const d=Store.draft; if(d && d.step==='study' && !d.pausedAt){ d.pausedAt=Date.now(); } Store.saveDraft(); go('home'); toast('진행 상황을 저장했어요'); },
  next(){ flushComposer(); const d=Store.draft; const i=STEPS.indexOf(d.step); d.step=STEPS[i+1]; Store.saveDraft(); go('flow'); },
  beginStudy(){ flushComposer(); const d=Store.draft; d.studyStartedAt=Date.now(); d.pausedMs=0; d.pausedAt=null; d.step='study'; Store.saveDraft(); go('flow'); },
  capture(el){ UI.capture = UI.capture===el.dataset.type ? null : el.dataset.type; render(); },
  saveCapture(){ const inp=$('#capIn'); if(!inp) return; const t=inp.value.trim(); if(!t){ UI.capture=null; render(); return; }
    const type=UI.capture; Store.draft.notes[type].push({id:uid(),text:t,at:Date.now()}); Store.saveDraft(); UI.capture=null; render(); toast(type==='questions'?'질문을 남겼어요':'기록했어요'); },
  endStudy(){ const d=Store.draft; d.studyEndedAt=Date.now(); d.studyDurationSec=Math.round((d.studyEndedAt-d.studyStartedAt-(d.pausedMs||0))/1000); d.step='recall'; Store.saveDraft(); go('flow'); },
  pick(el){ const d=Store.draft; d.assessment[el.dataset.field]=el.dataset.val; Store.saveDraft(); const y=window.scrollY; render(); window.scrollTo(0,y); },
  toTransfer(){ flushComposer(); const d=Store.draft; const a=d.assessment.nextAction;
    d.flags.needsExamples = a==='example'; d.flags.notMastered = a==='reexplain'; d.flags.keepForReview = a==='review';
    d.step='transfer'; Store.saveDraft(); go('flow'); },
  starter(el){ const ta=$('#tq'); ta.value=el.dataset.val+ta.value.replace(/^(만약 조건이 바뀐다면|예외적인 경우라면|비슷한 개념과 비교하면|실제 사례라면), /,''); ta.dispatchEvent(new Event('input',{bubbles:true})); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); },
  async aiTransfer(){ const q=await AI.generateTransferQuestion(Store.draft); if(q){ Store.draft.transfer.question=q; Store.draft.transfer.source='ai'; Store.saveDraft(); render(); } },
  complete(el){ completeSession(el.dataset.skip==='1'); },
  finishDone(){ go('home'); },
  openDetail(el){ go('detail',{id:el.dataset.id}); },
  review(el){ UI.review={phase:'write',answer:'',rating:null,msgs:[]}; go('review',{id:el.dataset.id}); },
  nextReview(){ const n=Store.dueReviews()[0]; if(n){ UI.review={phase:'write',answer:'',rating:null,msgs:[]}; go('review',{id:n.id}); } else go('home'); },
  revSubmit(){ flushComposer(); UI.review.answer=(UI.review.msgs||[]).map(m=>m.text).join('\n'); UI.review.at=Date.now(); UI.review.phase='reveal'; render(); window.scrollTo(0,0); },
  revRate(el){ rateReview(UI.params.id, el.dataset.val); },
  startFromInbox(el){ if(Store.draft && !armed(el,'진행 중인 학습을 버리고 시작')) return; startFromInbox(el.dataset.id); },
  resolveInbox(el){ Store.setInbox(el.dataset.id,{status:'resolved'}); Store.touchMeta(); render(); toast('해결됨으로 옮겼어요'); },
  inboxFilter(el){ UI.inboxFilter=el.dataset.val; render(); },
  saveLateTransfer(el){ const s=Store.state.sessions[el.dataset.id]; const q=$('#dtq').value.trim(), a=$('#dta').value.trim(); if(!q){ toast('응용 문제를 적어주세요'); return; }
    s.transfer={...s.transfer,question:q,answer:a,skipped:false}; Store.putSession(s); render(); toast('응용을 저장했어요'); },
  deleteSession(el){ if(!armed(el,'한 번 더 누르면 삭제됩니다')) return; Store.removeSession(el.dataset.id); go('history'); },
  async copyPrompt(el){
    const s = el.dataset.id ? Store.state.sessions[el.dataset.id] : Store.draft; if(!s) return;
    const text=buildPrompt(el.dataset.kind, s);
    if(await copyText(text)) toast(`‘${PROMPT_KINDS[el.dataset.kind].label}’ 프롬프트를 복사했어요`);
    else showCopySheet(text);
  },
  closeSheet(el,e){ if(el.dataset.force || e.target===el) $('#sheet-root').innerHTML=''; },
  sendMsg(){ sendMsg(); },
  undoMsg(){
    if(UI.view==='review'){ UI.review.msgs.pop(); UI.review.answer=UI.review.msgs.map(m=>m.text).join('\n'); render(); return; }
    const d=Store.draft; const f=$('#composerIn')?.dataset.field; if(!d||!f) return;
    const arr=d.chat&&d.chat[f] ? d.chat[f] : msgsOf(d,f).slice();
    arr.pop(); d.chat=d.chat||{}; d.chat[f]=arr; setPath(d,f,arr.map(m=>m.text).join('\n'));
    Store.saveDraft(); render(); window.scrollTo(0,document.body.scrollHeight);
  },
  deleteInbox(el){
    if(!armed(el,'한 번 더 누르면 삭제')) return;
    const id=el.dataset.id; delete Store.state.inbox[id];
    if(Store.draft && Store.draft.sourceInboxId===id) Store.draft.sourceInboxId=null;
    Store.touchMeta(); render(); toast('삭제했어요');
  },
  export(){ exportData(); },
  importPick(){ $('#importFile').click(); },
  importPasteToggle(){ $('#pasteBox').classList.toggle('hidden'); },
  importPaste(){ importData($('#importText').value); },
  resetAll(el){ if(!armed(el,'되돌릴 수 없어요. 한 번 더 누르면 모두 지웁니다')) return;
    for(const id in Store.state.sessions) Store.dirty.add('del:'+id);
    Store.state.sessions={}; Store.state.inbox={}; Store.state.draft=null; Store.touchMeta(); go('home'); },
};

/* 채팅 전송: 말풍선만 추가하고 단계는 그대로 */
function sendMsg(){
  const ta=$('#composerIn'); if(!ta) return false;
  const text=ta.value.trim(); if(!text) return false;
  const now=Date.now(); const msg={text,at:now};
  if(UI.view==='review'){
    UI.review.msgs=UI.review.msgs||[]; UI.review.msgs.push(msg);
    UI.review.answer=UI.review.msgs.map(m=>m.text).join('\n');
  } else {
    const d=Store.draft; const f=ta.dataset.field;
    d.chat=d.chat||{};
    if(!d.chat[f]) d.chat[f]=msgsOf(d,f).slice();
    d.chat[f].push(msg); setPath(d,f,d.chat[f].map(m=>m.text).join('\n'));
    Store.saveDraft();
  }
  // 키보드가 닫히지 않도록 입력창은 그대로 두고 말풍선만 붙인다
  const th=$('.thread'); if(th) th.insertAdjacentHTML('beforeend', me([esc(text)], now));
  ta.value=''; grow(ta); refreshComposer();
  const undo=$('[data-act="undoMsg"]'); if(undo) undo.disabled=false;
  window.scrollTo(0,document.body.scrollHeight);
  return true;
}
function flushComposer(){ sendMsg(); }
function refreshComposer(){
  const ta=$('#composerIn'); if(!ta) return;
  const has=!!ta.value.trim();
  const send=$('[data-act="sendMsg"]'); if(send) send.disabled=!has;
  const nb=$('#nextBtn'); if(!nb || nb.dataset.lock) return;
  if(nb.dataset.need) nb.disabled = !(has || String(getPath(Store.draft,nb.dataset.need)||'').trim());
}
function startFromInbox(id){
  const it=Store.state.inbox[id]; if(!it) return;
  if(Store.draft && Store.draft.sourceInboxId) Store.setInbox(Store.draft.sourceInboxId,{status:'open',startedSessionId:null});
  const s=newSession(it.text,id); s.step='attempt';
  Store.state.draft=s; Store.setInbox(id,{status:'started',startedSessionId:s.id}); Store.saveDraft(); go('flow');
}

function completeSession(skipTransfer){
  const d=Store.draft; const now=Date.now();
  if(skipTransfer) d.transfer.skipped=true;
  d.endedAt=now; d.status='completed'; d.step='done';
  if(!d.studyDurationSec && d.studyStartedAt) d.studyDurationSec=Math.round(((d.studyEndedAt||now)-d.studyStartedAt-(d.pausedMs||0))/1000);
  d.review={ stage:0, nextDue:startOfDay(now)+REVIEW_INTERVALS[0]*DAY, history:[] };
  // 아직 모르는 것으로 보내기
  for(const q of d.notes.questions) Store.addInbox(q.text,'newQuestion',d.id);
  if(d.assessment.ambiguity.trim()) Store.addInbox(d.assessment.ambiguity,'ambiguity',d.id);
  if(d.assessment.nextAction==='reexplain') Store.addInbox(d.question,'reexplain',d.id);
  if(d.assessment.nextAction==='example') Store.addInbox(d.question,'example',d.id);
  if(d.sourceInboxId) Store.setInbox(d.sourceInboxId,{status:'resolved'});
  const saved=clone(d); Store.state.draft=null;
  Store.putSession(saved); Store.touchMeta();
  go('flow',{done:saved.id});
}

function rateReview(id, rating){
  const s=Store.state.sessions[id]; const now=Date.now();
  let stage=s.review.stage;
  if(rating==='good') stage=Math.min(stage+1, REVIEW_INTERVALS.length);
  else if(rating==='poor') stage=0;
  const days = stage>=REVIEW_INTERVALS.length ? LONG_TERM_DAYS : REVIEW_INTERVALS[stage];
  const nextDue=startOfDay(now)+days*DAY;
  const prev=s.review.history[s.review.history.length-1];
  s.review.history.push({ id:uid(), at:now, answer:UI.review.answer, rating, nextDue });
  s.review.stage=stage; s.review.nextDue=nextDue;
  let added=false;
  if(rating==='poor' && prev && prev.rating==='poor'){
    const exists=Object.values(Store.state.inbox).some(i=>i.sessionId===id && i.kind==='reviewFail' && i.status!=='resolved');
    if(!exists){ Store.addInbox(s.question,'reviewFail',id); added=true; Store.touchMeta(); }
  }
  Store.putSession(s);
  UI.review.phase='result'; UI.review.rating=rating; UI.review.addedInbox=added; render(); window.scrollTo(0,0);
}

async function exportData(){
  const st=Store.state;
  const payload=JSON.stringify({ app:'learning-loop', exportedAt:new Date().toISOString(), version:1, sessions:st.sessions, inbox:st.inbox, draft:st.draft||null }, null, 2);
  const name=`learning-loop-${new Date().toISOString().slice(0,10)}.json`;
  if(window.top===window){
    try{ const blob=new Blob([payload],{type:'application/json'}); const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),2000); toast('내보냈어요'); return; }catch(e){}
  }
  let dl=null; try{ if(window.claude && claude.use) dl=await claude.use('downloads'); }catch(e){}
  if(dl){ try{ await dl.save({filename:name,data:payload}); toast('내보냈어요'); return; }catch(e){ if(e && e.code==='declined') return; } }
  // 대체: 복사할 수 있게 보여주기
  const box=$('#exportFallback'); if(box){ box.innerHTML=`<p class="muted small mt16" style="margin-bottom:8px">아래 내용을 복사해 .json 파일로 보관하세요.</p><textarea class="mid" readonly id="exportText">${esc(payload)}</textarea><button class="btn sm mt8" data-act="copyExport">복사</button>`; }
}
Actions.copyExport=async()=>{ const t=$('#exportText'); try{ await navigator.clipboard.writeText(t.value); toast('복사했어요'); }catch(e){ t.select(); document.execCommand&&document.execCommand('copy'); toast('복사했어요'); } };

function importData(text){
  let data; try{ data=JSON.parse(text); }catch(e){ toast('JSON 형식이 아니에요'); return; }
  if(!data || typeof data!=='object' || !data.sessions || typeof data.sessions!=='object'){ toast('Learning Loop에서 내보낸 파일이 아니에요'); return; }
  const st=Store.state; let n=0;
  for(const [id,s] of Object.entries(data.sessions)){ const l=st.sessions[id]; if(!l || (s.updatedAt||0)>(l.updatedAt||0)){ st.sessions[id]=s; Store.dirty.add('s:'+id); n++; } }
  for(const [id,it] of Object.entries(data.inbox||{})){ const l=st.inbox[id]; if(!l || (it.updatedAt||0)>(l.updatedAt||0)) st.inbox[id]=it; }
  if(data.draft && !st.draft) st.draft=data.draft;
  Store.touchMeta(); render(); toast(`학습 ${n}개를 가져왔어요`);
}

/* ───────── 이벤트 위임 ───────── */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const fn=Actions[el.dataset.act]; if(fn) fn(el,e);
});
let bindTimer=null;
document.addEventListener('input', e=>{
  const el=e.target;
  if(el.id==='hq'){ UI.historyQuery=el.value; const l=$('#hlist'); if(l) l.innerHTML=historyList(); return; }
  if(el.id==='revAns' && UI.review){ UI.review.answer=el.value; return; }
  if(el.hasAttribute('data-grow')) grow(el);
  if(el.id==='composerIn'){ refreshComposer(); return; }
  if(el.id==='revAns' && UI.review){ UI.review.answer=el.value; return; }
  const path=el.dataset.bind; if(!path || !Store.draft) return;
  setPath(Store.draft,path,el.value);
  // 필수 입력에 따라 버튼 활성화
  const d=Store.draft;
  const need=$('[data-need]'); if(need){ need.disabled=!String(d[need.dataset.need]||'').trim(); }
  if(d.step==='transfer'){ const b=$('[data-act="complete"][data-skip="0"]'); if(b) b.disabled=!(d.transfer.question.trim()&&d.transfer.answer.trim()); }
  clearTimeout(bindTimer); bindTimer=setTimeout(()=>Store.saveDraft(),600);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='capIn' && !e.isComposing){ e.preventDefault(); Actions.saveCapture(); }
  if(e.key==='Enter' && e.target.id==='composerIn' && !e.shiftKey && !e.isComposing && !matchMedia('(pointer:coarse)').matches){ e.preventDefault(); sendMsg(); }
  if(e.key==='Escape' && UI.capture){ UI.capture=null; render(); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='importFile' && e.target.files[0]){ const r=new FileReader(); r.onload=()=>importData(String(r.result)); r.readAsText(e.target.files[0]); e.target.value=''; }
});
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden'){ if(Store.draft) Store.saveDraft(); Remote.flush(); } });

/* ───────── 시작 ───────── */
Store.load();
render();
Remote.init();
if('serviceWorker' in navigator && location.protocol==='https:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
